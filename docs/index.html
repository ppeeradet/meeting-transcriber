<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Transcriber</title>
<style>:root{font-family:system-ui;color:#eaf2fa;background:#07111e;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1c5267,#07111e 45%);min-height:100vh}main{width:min(900px,90%);margin:auto;padding:48px 0}b{color:#63dfcd;letter-spacing:.15em;font-size:.75rem}h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.95;margin:.2em 0}p{color:#adc0cf}.panel,.job{padding:22px;border:1px solid #2b5360;border-radius:18px;background:#0e1c2bdd;margin:18px 0}textarea,input,select{width:100%;margin:8px 0 14px;padding:12px;background:#081421;border:1px solid #345364;border-radius:9px;color:white}button{padding:12px 18px;border:0;border-radius:9px;background:#63dfcd;color:#08201d;font-weight:800;cursor:pointer}.job a{color:#63dfcd;margin-right:12px}.status{float:right;color:#63dfcd}.error{color:#ff9696}</style></head>
<body><main><b>PERSONAL · LOCAL · PRIVATE</b><h1>Meeting<br>Transcriber</h1><p>หน้า GitHub Pages นี้เชื่อมกับ Dell ผ่าน Tailscale ไฟล์ทั้งหมดเก็บใน Dell เท่านั้น</p>
<section class="panel"><label>URL วิดีโอ (บรรทัดละหนึ่งรายการ)</label><textarea id="urls" rows="4" placeholder="https://youtu.be/xmyqhV0f9Go"></textarea><label>ชื่อไฟล์</label><input id="title"><label><input id="transcribe" type="checkbox" style="width:auto" checked> ถอดเสียงและสร้าง Word</label><button id="submit">เริ่มงานจาก URL</button><hr><label>หรือเลือก MP3 / MP4 / ไฟล์เสียงหรือวิดีโอ</label><input id="media" type="file" accept="audio/*,video/*,.mkv,.flac,.opus"><button id="upload">อัปโหลดและถอดเสียง</button><p id="msg"></p></section>
<h2>คิวงาน</h2><div id="jobs"></div></main>
<script>
const api='https://dell-pc.tail187694.ts.net/meeting-transcriber',jobs=document.querySelector('#jobs'),msg=document.querySelector('#msg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch(api+'/api/jobs');if(!r.ok)throw Error(r.status);const a=await r.json();jobs.innerHTML=a.map(j=>`<article class="job"><span class="status">${esc(j.status)}</span><strong>${esc(j.title||'ชื่ออัตโนมัติ')}</strong><p>${esc(j.progress)}</p>${j.error?`<p class="error">${esc(j.error)}</p>`:''}<div>${j.files.map(f=>`<a href="${api}/api/jobs/${encodeURIComponent(j.id)}/files/${encodeURIComponent(f)}">${esc(f)}</a>`).join('')}</div></article>`).join('')||'<p>ยังไม่มีงาน</p>'}catch(e){jobs.innerHTML='<p class="error">เชื่อมต่อ Dell ไม่ได้ — ตรวจว่าเครื่อง Dell เปิดอยู่และอุปกรณ์นี้เชื่อม Tailscale แล้ว</p>'}}
document.querySelector('#submit').onclick=async()=>{const urls=document.querySelector('#urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!urls.length)return msg.textContent='กรุณาใส่ URL';msg.textContent='กำลังส่งงาน…';const r=await fetch(api+'/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({urls,title:document.querySelector('#title').value||null,transcribe:document.querySelector('#transcribe').checked,language:'th'})});msg.textContent=r.ok?'เพิ่มงานแล้ว':'ส่งงานไม่สำเร็จ';load()};
document.querySelector('#upload').onclick=async()=>{const f=document.querySelector('#media').files[0];if(!f)return msg.textContent='กรุณาเลือกไฟล์';const d=new FormData();d.append('file',f);d.append('title',document.querySelector('#title').value||'');d.append('language','th');msg.textContent='กำลังอัปโหลด…';const r=await fetch(api+'/api/uploads',{method:'POST',body:d});msg.textContent=r.ok?'อัปโหลดแล้ว':'อัปโหลดไม่สำเร็จ';load()};load();setInterval(load,5000);
</script></body></html>
